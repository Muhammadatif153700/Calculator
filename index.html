<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="calculator">
    <header class="calculator-header">
        <h1>Calculator</h1>
    </header>

    <section class="calculator-body">
        <div class="display">0</div>

        <div class="buttons">
            <button class="function-key" type="button">AC</button>
            <button class="function-key" type="button">+/-</button>
            <button class="function-key" type="button">%</button>
            <button class="operator-key" type="button">÷</button>

            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button class="operator-key" type="button">×</button>

            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button class="operator-key" type="button">−</button>

            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button class="operator-key" type="button">+</button>

            <button class="zero-key" type="button">0</button>
            <button type="button">.</button>
            <button class="operator-key" type="button">=</button>
        </div>
    </section>
</main>

<div class="signature">Muhammad Atif</div>

</body>
</html>
